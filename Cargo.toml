[package]
name = "dune"
version = "0.11.4"
authors = ["Alex Alikiotis <alexalikiotis5@gmail.com>"]
edition = "2021"
license = "MIT"
readme = "README.md"
repository = "https://github.com/aalykiot/dune"
description = "A hobby runtime for JavaScript and TypeScript 🚀"

[[bin]]
name = "dune"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies.crabuv]
git = "https://github.com/aalykiot/crabuv"
rev = "8621445"

[dependencies]
v8 = { version = "152.2.0", default-features = false }
clap = { version = "4.6.7", features = ["derive"] }
anyhow = "1.0.104"
colored = "3.1.1"
rustyline = "19.0.0"
rustyline-derive = "0.13.0"
sha = "1.0.3"
regex = "1.13.1"
dirs = "7.0.0"
path-absolutize = "4.0.1"
ureq = { version = "3.5.0", features = ["charset"] }
phf = { version = "0.14.0", features = ["macros"] }
url = "2.5.8"
swc_common = { version = "27.0.0", features = ["tty-emitter", "sourcemap"] }
swc_ecma_codegen = "33.0.0"
swc_ecma_parser = "47.0.0"
swc_ecma_transforms_base = "51.0.1"
swc_ecma_transforms_typescript = "57.0.3"
swc_ecma_transforms_react = "57.0.2"
swc_bundler = "58.0.0"
swc_ecma_ast = "30.0.2"
swc_ecma_loader = "28.0.0"
swc_atoms = "10.0.0"
swc_ecma_transforms = "65.0.0"
swc_ecma_visit = "30.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
dns-lookup = "4.0.2"
tempdir = "0.3.7"
zstd = "0.14.3"
notify = "8.2.1"
httparse = "1.10.1"
pest = "2.9.5"
pest_derive = "2.9.5"
futures = "0.3.34"
tokio = { version = "1.54.1", features = ["full"] }
axum = { version = "0.8.9", features = ["ws"] }
uuid = { version = "1.29.0", features = ["v4", "fast-rng"] }
base64 = "0.23.1"
indicatif = "0.18.6"
rusqlite = { version = "0.41.1", features = ["bundled", "load_extension", "column_decltype", "column_metadata"] }
postcard = { version = "1.1.3", features = ["use-std"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", features = ["signal"] }

[target.'cfg(windows)'.dependencies]
enable-ansi-support = "0.3.1"

[dev-dependencies]
assert_fs = "1.1.4"
